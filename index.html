<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>F 850 GS K81 · Manual</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#111827;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:10}main{max-width:760px;margin:auto;padding:14px}h1{font-size:20px;margin:0}.sub{color:#cbd5e1;font-size:13px;margin-top:4px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}input{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:12px;font-size:16px}.item{padding:13px;border:1px solid #e5e7eb;border-radius:12px;margin:8px 0}.item b{display:block}.muted{color:#6b7280;font-size:13px}.badge{display:inline-block;background:#e5e7eb;border-radius:999px;padding:4px 8px;font-size:12px;margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:13px;font-weight:600}button{border:0;border-radius:12px;padding:12px 14px;background:#111827;color:#fff;font-weight:600}a{color:inherit;text-decoration:none}</style></head><body><header><h1>BMW F 850 GS K81</h1><div class="sub">Manual de taller interactivo</div></header><main><section class="card"><input id="q" placeholder="Buscar procedimiento, código o palabra…" oninput="render()"></section><section class="card"><h3>Accesos rápidos</h3><div class="grid"><div class="quick" onclick="q('horquilla')">🔧 Horquilla</div><div class="quick" onclick="q('freno')">🛑 Frenos</div><div class="quick" onclick="q('rueda')">🛞 Ruedas</div><div class="quick" onclick="q('aceite')">🛢️ Aceites</div></div></section><section class="card"><h3>Procedimientos</h3><div id="results"></div></section><section class="card"><b>Instalar en iPhone</b><p class="muted">En Safari: Compartir → Añadir a pantalla de inicio.</p></section></main><script>const DATA=[{code:'31 42 516',title:'Brazo de horquilla izquierdo: desarmar / ensamblar',page:459,tags:'horquilla suspensión aceite desmontar reparar'},{code:'31 42 517',title:'Brazo de horquilla derecho: desarmar / ensamblar',page:465,tags:'horquilla suspensión aceite desmontar reparar'},{code:'31 42 029',title:'Sustituir el puente inferior de la horquilla',page:459,tags:'horquilla dirección puente rueda'},{code:'',title:'Montaje del puente superior de la horquilla',page:'',tags:'horquilla dirección puente apriete 130 Nm 19 Nm'},{code:'35 21 000',title:'Pedal de freno: desmontar / montar o sustituir',page:'',tags:'freno pedal freno trasero'},{code:'',title:'Procedimientos de freno y purgado',page:'',tags:'freno purgar líquido frenos abs' }];function q(x){document.getElementById('q').value=x;render()}function render(){let s=document.getElementById('q').value.toLowerCase().trim();let a=DATA.filter(x=>(x.code+' '+x.title+' '+x.tags).toLowerCase().includes(s));document.getElementById('results').innerHTML=a.map(x=>`<div class="item"><b>${x.code?x.code+' · ':''}${x.title}</b><span class="badge">${x.page?'Página '+x.page:'Manual'}</span><div class="muted">${x.tags}</div></div>`).join('')||'<p class="muted">No hay resultados.</p>'}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
