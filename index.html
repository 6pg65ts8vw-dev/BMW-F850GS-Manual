<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>BMW F 850 GS K81 · Manual</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:10;background:#111827;color:#fff;padding:15px 14px;padding-top:calc(15px + env(safe-area-inset-top))}h1{font-size:19px;margin:0}.sub{font-size:12px;color:#cbd5e1;margin-top:3px}main{max-width:850px;margin:auto;padding:12px}.bar{display:flex;gap:8px}.bar input{flex:1}input{font:inherit;border:1px solid #d1d5db;border-radius:12px;padding:12px;background:#fff}button{font:inherit;border:0;border-radius:12px;padding:12px 14px;background:#111827;color:#fff;font-weight:700}.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #0001}.result{padding:13px;border:1px solid #e5e7eb;border-radius:12px;margin:8px 0}.result b{display:block}.meta{font-size:12px;color:#64748b;margin-top:5px}.pill{display:inline-block;background:#e2e8f0;border-radius:999px;padding:3px 8px;margin:2px;font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.small{font-size:12px;color:#64748b}.warn{background:#fff7ed;border-left:4px solid #f97316;padding:10px;border-radius:8px;font-size:12px}.hidden{display:none}#viewer{position:fixed;inset:0;background:#111;z-index:20;display:none}#viewer iframe{width:100%;height:100%;border:0}#viewer .close{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:21;background:#fff;color:#111;padding:8px 12px}.count{font-size:12px;color:#64748b;margin:8px 2px}</style></head><body><header><h1>BMW F 850 GS K81</h1><div class="sub">Manual de Taller · buscador interactivo</div></header><main><div class="card"><div class="bar"><input id="q" placeholder="Buscar procedimiento, código, pieza, par de apriete…"><button id="clear">✕</button></div><div class="actions"><button data-q="horquilla">🔧 Horquilla</button><button data-q="freno">🛑 Frenos</button><button data-q="aceite">🛢️ Aceite</button><button data-q="31 42">📖 Códigos 31 42</button></div></div><div class="card"><div class="warn"><b>Manual PDF:</b> pulsa “Seleccionar PDF” y elige el manual original en Archivos. La app usa ese PDF para abrir directamente la página y conservar sus dibujos y esquemas.</div><div class="actions"><button id="pick">📄 Seleccionar PDF</button><span id="fname" class="small"></span></div><input id="pdf" type="file" accept="application/pdf" class="hidden"></div><div id="count" class="count"></div><div id="results"></div></main><div id="viewer"><button class="close" id="close">Cerrar</button><iframe id="frame"></iframe></div><script src="data.js"></script><script>let pdfUrl=null;const q=document.getElementById('q'),res=document.getElementById('results'),count=document.getElementById('count');function esc(s){return s.replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function render(query=''){let z=query.toLowerCase().trim();let a=DATA.filter(x=>!z||(x.code+' '+x.title+' '+x.text).toLowerCase().includes(z));count.textContent=a.length+' resultados';res.innerHTML=a.slice(0,100).map((x,i)=>`<div class="card result"><b>${esc(x.code?x.code+' · ':'')}${esc(x.title)}</b><div class="meta"><span class="pill">Página ${x.page}</span>${x.section?'<span class="pill">'+esc(x.section)+'</span>':''}</div><div class="small">${esc(x.text.slice(0,260)).replace(/\n/g,' ')}</div><div class="actions"><button onclick="openPage(${x.page})">📄 Abrir página</button></div></div>`).join('')||(z?'<div class="card">No hay resultados.</div>':'');}window.openPage=function(page){if(!pdfUrl){alert('Primero selecciona el PDF del manual.');return}document.getElementById('frame').src=pdfUrl+'#page='+page;document.getElementById('viewer').style.display='block'};document.getElementById('close').onclick=()=>{document.getElementById('viewer').style.display='none';document.getElementById('frame').src='about:blank'};document.getElementById('pick').onclick=()=>document.getElementById('pdf').click();document.getElementById('pdf').onchange=e=>{const f=e.target.files[0];if(f){pdfUrl=URL.createObjectURL(f);document.getElementById('fname').textContent=f.name;}};document.getElementById('clear').onclick=()=>{q.value='';render()};q.oninput=()=>render(q.value);document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{q.value=b.dataset.q;render(q.value)});render();</script></body></html>
